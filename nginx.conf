# ==============================================================================
# Nginx Configuration for cptr.in / pastebin on VPS
# Place in: /etc/nginx/sites-available/cptr.in
# Symlink to: /etc/nginx/sites-enabled/cptr.in
# ==============================================================================

server {
    listen 80;
    server_name cptr.in www.cptr.in;
    
    # Redirect HTTP to HTTPS (uncomment when SSL is installed)
    # return 301 https://$host$request_uri;

    root /var/www/pastebin;
    index index.html;

    # Gzip Compression for fast delivery
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # 1. API Reverse Proxy to Python backend (runs on port 8000)
    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. Raw Text View (CLI curl friendly: curl cptr.in/raw/<hash>)
    location /raw/ {
        proxy_pass http://127.0.0.1:8000/raw/;
        proxy_set_header Host $host;
    }

    # 3. Pastebin SPA Routes: cptr.in/pastebin/[hash]
    location /pastebin/ {
        try_files $uri $uri/ /index.html;
    }

    # 4. Root & Static assets
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 5. Static Asset Caching
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }
}
