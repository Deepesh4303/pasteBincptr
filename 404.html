<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>cptr.in / pastebin - Redirecting...</title>
  <script>
    // GitHub Pages SPA router
    // Captures path like /pastebin/7kX9a or /7kX9a and forwards to index.html with ?p=
    (function() {
      const path = window.location.pathname;
      const search = window.location.search;
      const hash = window.location.hash;

      // Extract path segments
      const segments = path.split('/').filter(Boolean);
      let pasteHash = '';

      if (segments.length >= 2 && segments[0] === 'pastebin') {
        pasteHash = segments[1];
      } else if (segments.length === 1 && segments[0] !== 'pastebin') {
        pasteHash = segments[0];
      }

      // Determine root directory for redirection
      let base = './';
      if (path.includes('/pastebin/')) {
        base = path.substring(0, path.indexOf('/pastebin/') + 10);
      }

      if (pasteHash) {
        window.location.replace(base + '?p=' + encodeURIComponent(pasteHash) + (hash ? hash : ''));
      } else {
        window.location.replace(base);
      }
    })();
  </script>
</head>
<body style="font-family: sans-serif; text-align: center; padding-top: 50px; background: #0e1117; color: #e6edf3;">
  <p>Loading paste...</p>
</body>
</html>
