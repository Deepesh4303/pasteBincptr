# ==============================================================================
# Cloudflare Pages / Workers Configuration for cptr.in / pastebin
# ==============================================================================

name = "cptr-pastebin"
compatibility_date = "2024-01-01"
pages_build_output_dir = "."

# Cloudflare D1 Database Binding
# Replace `database_id` with your D1 database ID from Cloudflare dashboard
[[d1_databases]]
binding = "DB"
database_name = "pastebin-db"
database_id = "pastebin-db"
