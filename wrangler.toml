# ==============================================================================
# Cloudflare Worker + Static Assets Configuration
# ==============================================================================

name = "cptr-pastebin"
main = "worker.js"
compatibility_date = "2024-09-23"

# Static frontend assets (index.html, style.css, app.js)
[assets]
directory = "."
binding = "ASSETS"

# Cloudflare D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "pastebin-db"
database_id = "4a61c085-e150-4618-9a1d-63e272f19735"
